[project]
name = "vitalv3"
version = "0.1.0"
description = "Robot manipulator stack — STM32 motion + Mac perception/behaviour"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "msgpack>=1.1.0",
    "pydantic>=2.10.0",
    "pyserial>=3.5",
    "pyyaml>=6.0.2",
    "pyzmq>=26.2.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
robot-fake-motion = "pyrobot.hal.fake_motion_daemon:main"
robot-encoder-daemon = "pyrobot.hal.encoder_daemon:main"
robot-motion-cli = "pyrobot.hal.motion_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyrobot", "proto"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pyrobot", "proto"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["zmq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
